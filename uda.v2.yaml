# V2 review candidate; no activation authority
schema_version: 2
application:
  name: general-search
  kind: web
  display_name: "General Search"
  group: "TAIJU"
source:
  branch: main
  repository: "zageabb/general-search"
builds:
  - name: build
    toolchain: python
    working_dir: "."
    commands:
      - ["python","-m","pip","install","-r","requirements.txt"]
services:
  - name: web
    role: web
    runtime: python
    runtime_version: "3.10.12"
    working_dir: "."
    entrypoint: ["python","app.py"]
    port: 5053
    health:
      type: http
      path: "/"
    restart: on-failure
    required_builds: [build]
proxy:
  enabled: true
  upstream: web
  canonical_path: /apps/general-search/
  authentication: uda
environment:
  required: ["ADMIN_PASSWORD","ADMIN_USERNAME","MAIL_APP_PASSWORD","SECRET_KEY"]
deployment:
  strategy: systemd
  approval: explicit
  auto_update: false
  rollback: true
  github_reporting: false
