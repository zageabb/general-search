<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings · General Search</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='settings.css') }}"></head>
<body><div class="site-shell"><nav class="app-nav"><a class="brand-lockup" href="/"><span class="brand-mark">GS</span><span>General Search</span><span class="brand-version">v{{ config.APP_VERSION }}</span></a><div class="nav-links"><a href="/">Search</a><a class="active" href="/settings">Settings</a></div></nav>
<main class="settings-page"><header class="page-heading"><span class="eyebrow">Configuration</span><h1>Settings</h1><p>Control research behavior, learned website lists, and assistant instructions.</p></header><section class="panel settings-panel">
<form id="settings-form"><h2>Search settings</h2><div class="grid">
<label>Ollama URL<input name="ollama_url" value="{{ settings.ollama_url }}"></label><label>Default model<input name="model" value="{{ settings.model }}"></label><label>Search backend<input name="search_backend" value="{{ settings.search_backend }}"></label>
<label>Research rounds<input type="number" min="1" max="5" name="max_search_rounds" value="{{ settings.max_search_rounds }}"></label><label>Results per query<input type="number" min="2" max="10" name="results_per_query" value="{{ settings.results_per_query }}"></label><label>Pages to read<input type="number" min="1" max="30" name="max_pages_to_read" value="{{ settings.max_pages_to_read }}"></label><label>Parallel page fetches<input type="number" min="1" max="8" name="max_fetch_workers" value="{{ settings.max_fetch_workers }}"></label><label>Ollama embedding model <small>Optional; blank uses lexical ranking.</small><input name="embedding_model" value="{{ settings.embedding_model }}" placeholder="nomic-embed-text"></label>
<label>Country<input name="market_country" value="{{ settings.market_country }}"></label><label>Region<input name="market_region" value="{{ settings.market_region }}"></label><label>City<input name="market_city" value="{{ settings.market_city }}"></label>
<label class="wide">Allowed websites <small>Useful sites are added automatically.</small><textarea name="allowed_domains" rows="8">{{ settings.allowed_domains }}</textarea></label><label class="wide">Excluded websites <small>Manually excluded sites are never searched.</small><textarea name="blocked_domains" rows="8">{{ settings.blocked_domains }}</textarea></label>
<label class="full">Persistent instructions<textarea name="general_search_instructions" rows="5">{{ settings.general_search_instructions }}</textarea></label></div><button class="btn outline">Save search settings</button><span class="status" id="settings-status"></span></form><hr>
<form id="prompts-form"><h2>Assistant instructions</h2><label>Source usefulness review prompt<textarea name="source_review" rows="14">{{ prompts.source_review }}</textarea></label><label>Request routing and planning prompt<textarea name="planning" rows="16">{{ prompts.planning }}</textarea></label><label>Research coverage review prompt<textarea name="research_review" rows="14">{{ prompts.research_review }}</textarea></label><label>Web answer synthesis prompt<textarea name="answer" rows="12">{{ prompts.answer }}</textarea></label><label>Knowledge answer prompt<textarea name="direct_answer" rows="14">{{ prompts.direct_answer }}</textarea></label><label>Final answer review prompt<textarea name="review" rows="16">{{ prompts.review }}</textarea></label><label>Citation verification prompt<textarea name="citation_review" rows="16">{{ prompts.citation_review }}</textarea></label><button class="btn outline">Save assistant instructions</button><span class="status" id="prompts-status"></span></form>
</section></main></div><script src="{{ url_for('static', filename='settings.js') }}"></script></body></html>
